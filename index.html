<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红中血流成河麻将</title>
    <link rel="icon" type="image/svg+xml" href="assets/tiles/zhong.svg">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
    <header class="game-header">
        <h1 class="game-title" id="game-title" data-i18n="红中血流成河麻将">红中血流成河麻将</h1>
        <div class="header-actions">
            <div class="lang-switch-group" id="lang-switch-group">
                <button id="btn-lang-ja" class="btn-lang-seg" onclick="gameController.setLanguageMode('JA')">日</button>
                <button id="btn-lang-zh" class="btn-lang-seg" onclick="gameController.setLanguageMode('ZH')">汉</button>
                <button id="btn-lang-py" class="btn-lang-seg" onclick="gameController.setLanguageMode('PY')">A</button>
            </div>
            <button id="btn-start" onclick="gameController.handleStartGame()" data-i18n="开始对局">开始对局</button>
            <button id="btn-join" onclick="gameController.handleJoinRoom()" data-i18n="加入房间">加入房间</button>
        </div>
    </header>

    <div id="room-bar" class="room-bar">
        <div class="room-info-left">
            <span><span id="lbl-room-code" data-i18n="房间号">房间号</span>: <b id="room-code-display"></b> <span id="room-role-display">(房主)</span></span>
            <button id="btn-change-room" onclick="gameController.handleChangeRoom()" data-i18n="换号">换号</button>
            <button id="btn-change-name" onclick="gameController.handleChangeName()" data-i18n="改名">改名</button>
        </div>
        <div id="room-members-display">
            <span class="member-badge human">1P (你/房主)</span>
            <span class="member-badge cpu">2P (电脑)</span>
            <span class="member-badge cpu">3P (电脑)</span>
            <span class="member-badge cpu">4P (电脑)</span>
        </div>
    </div>

    <table class="status-table">
        <thead>
            <tr>
                <th id="th-player" data-i18n="玩家">玩家</th>
                <th id="th-score" data-i18n="积分">积分</th>
                <th id="th-state" data-i18n="定缺/状态">定缺/状态</th>
                <th id="th-melds" data-i18n="副露">副露</th>
            </tr>
        </thead>
        <tbody id="opponents-tbody"></tbody>
        <tfoot>
            <tr>
                <td id="td-wall-lbl" data-i18n="剩余牌山">剩余牌山</td>
                <td colspan="3"><b id="wall-num">112</b> <span id="lbl-tiles-unit" data-i18n="张">张</span></td>
            </tr>
        </tfoot>
    </table>

    <fieldset class="river-section">
        <legend id="legend-river" data-i18n="弃牌区">弃牌区</legend>
        <div id="river-container"></div>
    </fieldset>

    <fieldset class="log-section">
        <legend id="legend-log" data-i18n="日志">日志</legend>
        <div class="sys-log" id="cmd-log"><div>> 系统就绪。</div></div>
    </fieldset>

    <fieldset class="my-section">
        <div class="my-status-bar">
            <span><span id="lbl-my-score" data-i18n="积分">积分</span>: <b id="hand-score-0">5000</b></span>
            <span class="tag-que" id="hand-que-0"></span>
            <span class="tag-hu" id="hu-tag-0"></span>
            <span id="ting-info" class="ting-panel" style="display:none;"><b id="lbl-ting" data-i18n="听牌">听牌</b>: <span id="ting-list"></span></span>
            <div class="auto-toggles-wrapper">
                <button id="btn-auto-que" class="btn-auto-toggle">自动打缺: 关</button>
                <button id="btn-auto" class="btn-auto-toggle">托管: 关</button>
            </div>
        </div>

        <div class="instruction-box" id="phase-instruction" style="display:none;">
            <b id="instruction-title">换三张</b>: <span id="instruction-desc">选3张牌</span>
            <span id="instruction-options"></span>
        </div>

        <div class="my-hand-wrapper">
            <span id="hand-0" class="tile-group"></span>
            <span id="melds-0" class="tile-group"></span>
        </div>

        <div id="cmd-box" class="action-box" style="display:none;">
            <button id="btn-hu" class="btn-action btn-hu">胡 (H)</button>
            <button id="btn-gang" class="btn-action">杠 (G)</button>
            <button id="btn-pung" class="btn-action">碰 (P)</button>
            <button id="btn-pass" class="btn-action">过 (X)</button>
        </div>
        <div id="auto-hu-msg" class="tag-hu" data-i18n="已胡牌（自动摸打中）" style="display:none; margin-top: 6px;">已胡牌（自动摸打中）</div>
    </fieldset>

    <div class="modal-overlay" id="result-modal" style="display:none;">
        <div class="modal-content">
            <h3 id="lbl-result-title" data-i18n="对局结算">对局结算</h3>
            <div id="result-ranks"></div>
            <div id="result-penalties" class="result-penalties"></div>
            <div class="result-actions">
                <button class="btn-restart" onclick="gameController.handleRestartClick()" data-i18n="再来一局">再来一局</button>
                <button id="btn-reset-room" onclick="gameController.handleResetAndNewRoom()" data-i18n="新建房间 (重置)">新建房间 (重置)</button>
            </div>
        </div>
    </div>

    <script src="js/engine.js?v=2.3"></script>
    <script src="js/sound.js?v=2.3"></script>
    <script src="js/p2p.js?v=2.3"></script>
    <script src="js/ui.js?v=2.3"></script>
    <script src="js/game.js?v=2.3"></script>
</body>
</html>
