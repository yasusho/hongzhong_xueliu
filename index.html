<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红中血流成河麻将</title>
    <link rel="icon" type="image/svg+xml" href="assets/tiles/zhong.svg">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
    <header class="game-header">
        <h1 class="game-title" id="game-title">红中血流成河麻将</h1>
        <div class="header-actions">
            <button id="btn-pinyin" onclick="gameController.togglePinyin()" title="切换拼音/汉字显示">汉↔A</button>
            <button id="btn-start" onclick="gameController.handleStartGame()">开始对局</button>
            <button id="btn-join" onclick="gameController.handleJoinRoom()">加入房间</button>
        </div>
    </header>

    <div id="room-bar" class="room-bar">
        <div class="room-info-left">
            <span><span id="lbl-room-code">房间号</span>: <b id="room-code-display"></b> <span id="room-role-display">(房主)</span></span>
            <button id="btn-change-room" onclick="gameController.handleChangeRoom()" title="重新生成4位房间号">换号</button>
            <button id="btn-change-name" onclick="gameController.handleChangeName()" title="修改你的显示昵称">改名</button>
        </div>
        <div id="room-members-display">
            <span class="member-badge human">1P (你/房主)</span>
            <span class="member-badge cpu">2P (电脑)</span>
            <span class="member-badge cpu">3P (电脑)</span>
            <span class="member-badge cpu">4P (电脑)</span>
        </div>
    </div>

    <table class="status-table">
        <thead>
            <tr>
                <th id="th-player">玩家</th>
                <th id="th-score">积分</th>
                <th id="th-state">定缺/状态</th>
                <th id="th-melds">副露</th>
            </tr>
        </thead>
        <tbody id="opponents-tbody"></tbody>
        <tfoot>
            <tr>
                <td id="td-wall-lbl">剩余牌山</td>
                <td colspan="3"><b id="wall-num">112</b> <span id="lbl-tiles-unit">张</span></td>
            </tr>
        </tfoot>
    </table>

    <fieldset class="river-section">
        <legend id="legend-river">弃牌区</legend>
        <div id="river-container"></div>
    </fieldset>

    <fieldset class="log-section">
        <legend id="legend-log">日志</legend>
        <div class="sys-log" id="cmd-log"><div>> 系统就绪。</div></div>
    </fieldset>

    <fieldset class="my-section">
        <div class="my-status-bar">
            <span><span id="lbl-my-score">积分</span>: <b id="hand-score-0">5000</b></span>
            <span class="tag-que" id="hand-que-0"></span>
            <span class="tag-hu" id="hu-tag-0"></span>
            <span id="ting-info" class="ting-panel" style="display:none;"><b id="lbl-ting">听牌</b>: <span id="ting-list"></span></span>
            <div class="auto-toggles-wrapper">
                <button id="btn-auto-que" class="btn-auto-toggle" title="自动打缺门牌">自动打缺: 关</button>
                <button id="btn-auto" class="btn-auto-toggle" title="自动托管对局">托管: 关</button>
            </div>
        </div>

        <div class="instruction-box" id="phase-instruction" style="display:none;">
            <b id="instruction-title">换三张</b>: <span id="instruction-desc">选3张牌</span>
            <span id="instruction-options"></span>
        </div>

        <div class="my-hand-wrapper">
            <span id="hand-0" class="tile-group"></span>
            <span id="melds-0" class="tile-group"></span>
        </div>

        <div id="cmd-box" class="action-box" style="display:none;">
            <button id="btn-hu" class="btn-action btn-hu">胡 (H)</button>
            <button id="btn-gang" class="btn-action">杠 (G)</button>
            <button id="btn-pung" class="btn-action">碰 (P)</button>
            <button id="btn-pass" class="btn-action">过 (X)</button>
        </div>
        <div id="auto-hu-msg" class="tag-hu" style="display:none; margin-top: 6px;">已胡牌（自动摸打中）</div>
    </fieldset>

    <div class="modal-overlay" id="result-modal" style="display:none;">
        <div class="modal-content">
            <h3 id="lbl-result-title">对局结算</h3>
            <div id="result-ranks"></div>
            <div id="result-penalties" class="result-penalties"></div>
            <div class="result-actions">
                <button class="btn-restart" onclick="gameController.initGame(false)">再来一局</button>
                <button id="btn-reset-room" onclick="gameController.handleResetAndNewRoom()">新建房间 (重置)</button>
            </div>
        </div>
    </div>

    <script src="js/dsl.js?v=2.1"></script>
    <script src="js/pinyin.js?v=2.1"></script>
    <script src="js/engine.js?v=2.1"></script>
    <script src="js/p2p.js?v=2.1"></script>
    <script src="js/main.js?v=2.1"></script>
</body>
</html>
